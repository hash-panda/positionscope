name: Quality and preview release
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: node scripts/verify-site.cjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pnpm test:ui
  storage-macos:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:main && bash scripts/verify-secure-settings-native.sh
      - name: Verify direct package download despite an unavailable local proxy
        run: bash scripts/install-verified-mac.sh --verify-only --direct
        env:
          https_proxy: http://127.0.0.1:1
          HTTPS_PROXY: http://127.0.0.1:1
          all_proxy: http://127.0.0.1:1
          ALL_PROXY: http://127.0.0.1:1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-native-evidence
          path: test-results/storage-native.json
          if-no-files-found: error
  quality:
    if: always()
    needs: [checks, storage-macos]
    runs-on: ubuntu-latest
    steps:
      - run: test "$CHECKS" = success && test "$STORAGE" = success
        env:
          CHECKS: ${{ needs.checks.result }}
          STORAGE: ${{ needs.storage-macos.result }}
