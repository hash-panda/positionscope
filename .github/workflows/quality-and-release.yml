name: Quality and preview release
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pnpm test:ui
  preview-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: quality
    runs-on: macos-14
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned macOS archives
        run: pnpm build && pnpm exec electron-builder --mac zip --arm64 --x64 --publish never
      - name: Publish preview only after builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          preview_version=$(node -p 'require("./package.json").version')
          preview_tag="v${preview_version}"
          if gh release view "$preview_tag" >/dev/null 2>&1; then exit 0; fi
          shasum -a 256 release/*.zip > release/SHA256SUMS.txt
          gh release create "$preview_tag" release/*.zip release/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "PositionScope ${preview_version}" --notes-file docs/release-notes.md
