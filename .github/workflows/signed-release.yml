name: Signed macOS release
on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'build/**'
      - 'assets/**'
      - 'scripts/release-signed-mac.py'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.npmrc'
      - '.github/workflows/signed-release.yml'
permissions:
  contents: read
concurrency:
  group: signed-macos-release
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      release_required: ${{ steps.release.outputs.required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Require a reviewed master commit and matching version tag
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF#refs/tags/v}" = "$(node -p 'require("./package.json").version')"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build
      - name: Check immutable release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request, urllib.error, urllib.parse
          version=json.load(open('package.json'))['version']
          tag='v'+version
          url=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/releases/tags/'+urllib.parse.quote(tag,safe='')
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'PositionScope-release'})
          try:
              with urllib.request.urlopen(request,timeout=30) as response:
                  assert json.load(response)['tag_name']==tag
              required=False
          except urllib.error.HTTPError as error:
              if error.code!=404: raise
              required=True
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('required='+str(required).lower()+'\n')
          print('New version ready for signing' if required else 'Version already released; skip signing. Increment package.json for a new binary.')
          PYCODE
  sign:
    if: needs.quality.outputs.release_required == 'true' && (github.event_name == 'workflow_dispatch' || vars.APPLE_SIGNING_ENABLED == 'true')
    needs: quality
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: {arch: [arm64, x64]}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify native settings storage with a synthetic profile
        run: bash scripts/verify-secure-settings-native.sh
      - name: Sign, notarize, staple and verify
        run: python3 scripts/release-signed-mac.py --arch '${{ matrix.arch }}'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-${{ matrix.arch }}
          path: release/signed/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'signed-*', path: signed, merge-multiple: true}
      - name: Create immutable signed preview
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          test "$(find signed -name '*.zip' | wc -l)" -eq 2
          test "$(find signed -name '*.dmg' | wc -l)" -eq 2
          (cd signed && sha256sum *.zip *.dmg > SHA256SUMS.txt)
          gh release create "v${version}" signed/* --target "$GITHUB_SHA" --prerelease --title "PositionScope ${version} — signed & notarized" --notes-file docs/release-notes.md
